services:
  postgres:
    image: postgres:16-alpine
    container_name: claimguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claimguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-claimguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claimguard} -d ${POSTGRES_DB:-claimguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    container_name: claimguard-falkordb
    restart: unless-stopped
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: claimguard-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init-bucket:
    image: cgr.dev/chainguard/minio:latest
    container_name: claimguard-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-claimguard-documents}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY;
      /usr/bin/mc mb --ignore-existing local/$$S3_BUCKET_NAME;
      /usr/bin/mc anonymous set none local/$$S3_BUCKET_NAME;
      exit 0;
      "

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: claimguard-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-claimguard}:${POSTGRES_PASSWORD:-claimguard_dev_password}@postgres:5432/${POSTGRES_DB:-claimguard}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-claimguard}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-claimguard_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-claimguard}
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - FALKORDB_GRAPH_NAME=${FALKORDB_GRAPH_NAME:-claimguard}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-claimguard-documents}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_SSL=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev_jwt_secret_key_minimum_32_characters_long_for_security}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - MAX_UPLOAD_SIZE_BYTES=26214400
      - ALLOWED_MIME_TYPES=["application/pdf","image/png","image/jpeg","text/plain","message/rfc822"]
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8000"]
      - PRESIGNED_URL_EXPIRE_SECONDS=300
      - RATE_LIMIT_LOGIN_PER_MINUTE=5
      - RATE_LIMIT_REGISTER_PER_MINUTE=3
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init-bucket:
        condition: service_completed_successfully

volumes:
  postgres_data:
  falkordb_data:
  minio_data:
